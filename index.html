<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ==================== SEO & META ==================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>TTC Bus Delay Analytics | Toronto Transit Commission</title>
    <meta name="description" content="Explore 12 years of TTC bus delays across Toronto. Interactive map with routes, wards, neighbourhoods, and hotspots.">
    <meta property="og:title" content="TTC Bus Delay Analytics">
    <meta property="og:description" content="Explore 12 years of TTC bus delays across Toronto.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ttcdelay.kbains.com/">
    <meta property="og:image" content="assets/images/social-preview.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://ttcdelay.kbains.com/">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <!-- ==================== CSS & FONTS ==================== -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- Local styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/mobile.css">

    <!-- ==================== SCRIPTS (load order matters) ==================== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js" charset="utf-8"></script>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

    <!-- Application modules -->

    <script src="js/dataLoader.js"></script>
    <script src="js/mapVisualizer.js"></script>
    <script src="js/uiController.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/dashboard.js"></script>   <!-- New dashboard controller -->
    <script src="js/app.js"></script>

    <!-- Inline style for critical path (optional) -->
    <style>
        /* Ensure the map container fills the viewport immediately */
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
        #app { height: 100%; width: 100%; position: relative; }
        .map-container { height: 100%; width: 100%; background: #0f1117; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="app">
        <!-- ==================== MAP CONTAINER ==================== -->
        <div class="map-container">
            <div id="map"></div>
        </div>

        <!-- Dashboard Content (hidden by default) -->
        <div class="dashboard-content" id="dashboardContent">
            <div class="dashboard-content-inner" id="dashboardContentInner">
                <!-- Charts will be injected here by DashboardController -->
            </div>
        </div>

        <!-- ==================== DESKTOP UI OVERLAYS ==================== -->

        <!-- Top‑left Collapsible Control Panel (branding + filters) -->
        <div class="control-panel" id="controlPanel">
            <div class="panel-header">
                <button class="panel-toggle" id="panelToggle" aria-label="Toggle panel">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <span class="brand">TTC Delay Analytics</span>
            </div>
            <div class="panel-content" id="panelContent">
                <!-- View selector (pill style inside panel) -->
                <div class="view-selector">
                    <button class="view-btn active" data-view="routes">Routes</button>
                    <button class="view-btn" data-view="wards">Wards</button>
                    <button class="view-btn" data-view="neighbourhoods">Districts</button>
                    <button class="view-btn" data-view="hotspots">Hotspots</button>
                </div>

                <!-- Metric toggle (Time / Frequency) -->
                <div class="metric-selector">
                    <button class="metric-btn active" data-metric="time">⏱️ Time (avg delay)</button>
                    <button class="metric-btn" data-metric="frequency">📈 Frequency (count)</button>
                </div>

                <!-- Filters section (expandable) -->
                <div class="filters-section">
                    <h4>
                        Filters
                        <button id="resetFiltersBtn" class="reset-filters-btn" title="Reset all filters">
                            <i class="fas fa-undo-alt"></i>
                        </button>
                        <span class="filter-badge" id="activeFilterCount">0</span>
                    </h4>
                    <div class="filter-group">
                        <label>Year</label>
                        <div id="yearFilter"></div>  <!-- custom dropdown container -->
                    </div>
                    <div class="filter-group">
                        <label>Transit Type</label>
                        <div id="transitFilter"></div>  <!-- custom dropdown container -->
                    </div>
                    <div class="filter-group">
                        <label>Incident Category</label>
                        <div id="incidentFilter"></div>  <!-- custom dropdown container -->
                    </div>
                    <div class="filter-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="activeOnlyFilter" checked> Hide inactive routes
                        </label>
                    </div>
                    <div class="filter-group">
                        <label>Route Search</label>
                        <input type="text" id="routeSearchInput" placeholder="e.g. 36, 36A" class="filter-input">
                        <div id="searchResults" class="search-results-dropdown"></div>
                    </div>
                </div>

                <!-- Theme toggle at bottom -->
                <div class="panel-footer">
                    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="floating-island dashboard-tab-island" id="dashboardTabIsland" style="display: none;">
            <button class="dashboard-tab-item active" data-tab="overview">Overview</button>
            <button class="dashboard-tab-item" data-tab="time-patterns">Time Patterns</button>
            <button class="dashboard-tab-item" data-tab="route-analysis">Route Analysis</button>
        </div>

        <!-- Top‑right KPI overlay -->
        <div class="kpi-overlay">
            <div class="kpi-card" id="kpiPrimary">
                <span class="kpi-label" id="kpiPrimaryLabel">Avg Delay</span>
                <span class="kpi-value" id="kpiPrimaryValue">--</span>
                <span class="kpi-trend" id="kpiPrimaryTrend"></span>
            </div>
            <div class="kpi-card">
                <span class="kpi-label">Total Incidents</span>
                <span class="kpi-value" id="kpiTotalIncidents">--</span>
                <span class="kpi-trend" id="kpiTotalTrend"></span>
            </div>
            <div class="kpi-card">
                <span class="kpi-label">Routes Reporting</span>
                <span class="kpi-value" id="kpiRoutesReporting">--</span>
                <span class="kpi-trend" id="kpiRoutesTrend"></span>
            </div>
        </div>

        

        <!-- Bottom‑left Legend -->
        <div class="legend-overlay" id="legendOverlay">
            <div class="legend-gradient"></div>
            <div class="legend-labels">
                <span id="legendMin">0</span>
                <span id="legendMax">60+</span>
            </div>
            <span class="legend-metric" id="legendMetric">Avg Delay (min)</span>
        </div>

        <!-- Floating island for primary navigation (Time, Frequency, About) -->
        <div class="floating-island" id="primaryNav">
            <button class="nav-item active" data-nav="time">Time</button>
            <button class="nav-item" data-nav="frequency">Frequency</button>
            <button class="nav-item" data-nav="dashboard">Dashboard</button>
            <button class="nav-item" data-nav="about">About</button>
            
        </div>

        <!-- Floating island for layer switching (Routes, Wards, Neighbourhoods, Hotspots) -->
        <div class="floating-island layer-island" id="layerNav">
            <button class="layer-item active" data-layer="routes">Routes</button>
            <button class="layer-item" data-layer="wards">Wards</button>
            <button class="layer-item" data-layer="neighbourhoods">Districts</button>
            <button class="layer-item" data-layer="hotspots">Hotspots</button>
        </div>

        <!-- Bottom sheet container (for mobile & desktop detail views) -->
        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-header">
                <div class="sheet-drag-handle"></div>
                <h3 id="sheetTitle">Route Details</h3>
                <button class="sheet-close" id="sheetClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="sheet-content" id="sheetContent">
                <!-- populated dynamically -->
            </div>
        </div>

        <!-- Tooltip container (desktop hover) -->
        <div class="tooltip-custom" id="customTooltip" style="display: none;"></div>

        <!-- ==================== ABOUT CONTAINER ==================== -->
        <div class="about-container" id="about-container">
            <div class="about-content">
                <button class="about-close" id="aboutCloseBtn"><i class="fas fa-times"></i></button>
                <div id="aboutContent"></div>
            </div>
        </div>

        <!-- NOTE: The old static mobile container has been removed. The new mobile UI is built dynamically by MobileController. -->
    </div>

    <!-- ==================== INITIALIZATION SCRIPT ==================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.ttcApp = new TTCVisualizationApp();
        });
    </script>
</body>
</html>
